version: 2
updates:
  # Dependências Python (requirements.txt / requirements-dev.txt).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Actions usadas no workflow de CI (actions/checkout, actions/setup-python).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
