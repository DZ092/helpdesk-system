# Infraestrutura como código: o Render lê este arquivo e configura o serviço
# sozinho, em vez de você preencher os campos no painel a cada vez.
services:
  - type: web
    name: helpdesk-system
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    # O serve.py sobe o Waitress e cria as tabelas que ainda não existirem.
    startCommand: python serve.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      # O Render injeta a porta em PORT; o serve.py já lê essa variável.
      - key: HOST
        value: 0.0.0.0
      # Cookie de sessão só trafega por HTTPS em produção.
      - key: SESSION_COOKIE_SECURE
        value: "1"
      # Preenchidas no painel, nunca no repositório.
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
