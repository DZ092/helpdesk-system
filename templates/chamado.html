<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

<title>Abrir Chamado</title>

<script>
// Aplica o tema salvo (ou o do sistema operacional) antes do CSS carregar,
// para não piscar no tema errado por uma fração de segundo. Lógica completa
// e comentada em static/js/tema.js — este trecho precisa ser inline e vir
// antes do <link> do CSS, senão o navegador já pintou a tela no tema padrão.
(function () {
    var tema;
    try {
        tema = localStorage.getItem("tema-preferido");
    } catch (erro) {
        tema = null;
    }
    if (!tema) {
        var prefereClaro = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
        tema = prefereClaro ? "light" : "dark";
    }
    document.documentElement.setAttribute("data-theme", tema);
})();
</script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script src="{{ url_for('static', filename='js/tema.js') }}"></script>

</head>


<body>


<div class="container">


<h1>📋 Abrir Novo Chamado</h1>

<p class="subtitulo">
Informe os dados do problema técnico
</p>


{% with mensagens = get_flashed_messages() %}
{% if mensagens %}
<p class="sucesso">{{ mensagens[0] }}</p>
{% endif %}
{% endwith %}


{% if erro %}
<p class="erro">{{ erro }}</p>
{% endif %}



<form method="POST" class="formulario" id="form-chamado" enctype="multipart/form-data">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">


<div class="campo">

<label>Usuário</label>

<input 
type="text"
name="usuario"
placeholder="Nome do usuário"
required>

</div>



<div class="campo">

<label>Setor</label>

<input 
type="text"
name="setor"
placeholder="Ex: TI, RH, Financeiro"
required>

</div>



<div class="campo">

<label>Título do problema</label>

<input 
type="text"
name="titulo"
placeholder="Título do problema"
required>

</div>



<div class="campo">

<label>Descrição</label>

<textarea
name="descricao"
placeholder="Descreva o problema encontrado"
rows="5"
required></textarea>

</div>



<div class="campo">

<label>Prioridade</label>

<select name="prioridade" required>
<option value="Baixa">Baixa</option>
<option value="Média" selected>Média</option>
<option value="Alta">Alta</option>
<option value="Crítica">Crítica</option>
</select>

</div>



<div class="campo">

<label for="anexos">Anexar imagens (opcional)</label>

<input
type="file"
id="anexos"
name="anexos"
accept="image/png,image/jpeg,image/webp"
multiple>

<p class="dica-campo">Até 5 imagens (PNG, JPG ou WEBP), 5 MB cada.</p>

</div>



<button class="botao" type="submit" id="botao-enviar">

🚀 Enviar chamado

</button>


</form>


<p class="link-secundario">
É da equipe técnica? <a href="/login">Fazer login</a>
</p>


</div>


<script>
document.getElementById("form-chamado").addEventListener("submit", function () {
    var botao = document.getElementById("botao-enviar");
    botao.disabled = true;
    botao.textContent = "⏳ Enviando...";
});
</script>


</body>

</html>
