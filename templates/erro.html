{% extends "base.html" %}

{% block titulo %}{{ codigo }} · Help Desk{% endblock %}

{% block classe_body %}pagina-erro{% endblock %}

{% block corpo %}
<main class="erro-pagina" id="conteudo">
    <section class="cartao erro-cartao" aria-labelledby="titulo-erro">
        <p class="pagina-rotulo">Erro {{ codigo }}</p>

        <p class="erro-mensagem">{{ mensagem }}</p>

    </section>
</main>
{% endblock %}
