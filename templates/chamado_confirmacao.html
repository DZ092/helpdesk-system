<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

<title>Chamado enviado</title>

<script nonce="{{ csp_nonce() }}">
// Aplica o tema salvo (ou o do sistema operacional) antes do CSS carregar,
// para não piscar no tema errado por uma fração de segundo. Lógica completa
// e comentada em static/js/tema.js — este trecho precisa ser inline e vir
// antes do <link> do CSS, senão o navegador já pintou a tela no tema padrão.
(function () {
    var tema;
    try {
        tema = localStorage.getItem("tema-preferido");
    } catch (erro) {
        tema = null;
    }
    if (!tema) {
        var prefereClaro = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
        tema = prefereClaro ? "light" : "dark";
    }
    document.documentElement.setAttribute("data-theme", tema);
})();
</script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script src="{{ url_for('static', filename='js/tema.js') }}"></script>

</head>


<body>


<div class="container">


<div id="seletor-tema" class="seletor-tema"><button type="button" data-tema="dark"></button><button type="button" data-tema="light"></button></div>



<h1>✅ Chamado enviado com sucesso</h1>

<p class="subtitulo">
Nossa equipe vai analisar em breve
</p>


<p>
Guarde o código abaixo: é a única forma de consultar o andamento deste chamado depois, sem precisar criar conta.
</p>

<p class="token-gerado">
<code>{{ codigo_acompanhamento }}</code>
<button type="button" class="botao-copiar" id="botao-copiar-codigo" data-token="{{ codigo_acompanhamento }}">Copiar</button>
</p>


<p class="link-secundario">
<a href="/chamado/acompanhar">Consultar um chamado com o código</a>
</p>

<p class="link-secundario">
<a href="/chamado">Abrir outro chamado</a>
</p>


</div>


<script nonce="{{ csp_nonce() }}">
(function () {
    var botao = document.getElementById("botao-copiar-codigo");
    if (!botao) {
        return;
    }
    var textoOriginal = botao.textContent;
    botao.addEventListener("click", function () {
        var codigo = botao.getAttribute("data-token");
        function avisar() {
            botao.textContent = "Copiado!";
            botao.classList.add("copiado");
            setTimeout(function () {
                botao.textContent = textoOriginal;
                botao.classList.remove("copiado");
            }, 2000);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(codigo).then(avisar, function () {
                window.prompt("Copie o código:", codigo);
            });
        } else {
            window.prompt("Copie o código:", codigo);
        }
    });
})();
</script>

</body>

</html>
