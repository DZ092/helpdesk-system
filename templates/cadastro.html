<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

<title>Cadastro - Help Desk</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">

</head>


<body class="pagina-auth">


<div class="container">


<h1>📝 Criar Conta</h1>

<p class="subtitulo">
Cadastro de acesso ao sistema
</p>


{% if erro %}
<p class="erro">{{ erro }}</p>
{% endif %}


<form method="POST" class="formulario">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">


<div class="campo">

<label for="nome">Nome</label>

<div class="campo-input">
<span class="icone-campo" aria-hidden="true">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
</span>
<input
id="nome"
type="text"
name="nome"
placeholder="Seu nome completo"
required>
</div>

</div>



<div class="campo">

<label for="email">E-mail</label>

<div class="campo-input">
<span class="icone-campo" aria-hidden="true">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
</span>
<input
id="email"
type="email"
name="email"
placeholder="seuemail@exemplo.com"
required>
</div>

</div>



<div class="campo">

<label for="senha">Senha</label>

<div class="campo-input">
<span class="icone-campo" aria-hidden="true">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
</span>
<input
id="senha"
type="password"
name="senha"
placeholder="Mínimo de 8 caracteres"
minlength="8"
required>
</div>

</div>



<p class="link-secundario">
Toda conta nova é criada com o perfil <strong>Usuário</strong>. Perfis de Técnico e
Administrador são concedidos por um administrador no painel do sistema.
</p>



<button class="botao" type="submit">

Cadastrar

</button>


</form>


<p class="link-secundario">
Já tem conta? <a href="/login">Fazer login</a>
</p>


</div>


</body>

</html>
