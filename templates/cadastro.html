<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

<title>Cadastro - Help Desk</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>


<div class="container">


<h1>📝 Criar Conta</h1>

<p class="subtitulo">
Cadastro de acesso ao sistema
</p>


{% if erro %}
<p class="erro">{{ erro }}</p>
{% endif %}


<form method="POST" class="formulario">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">


<div class="campo">

<label>Nome</label>

<input 
type="text"
name="nome"
placeholder="Seu nome completo"
required>

</div>



<div class="campo">

<label>E-mail</label>

<input 
type="email"
name="email"
placeholder="seuemail@exemplo.com"
required>

</div>



<div class="campo">

<label>Senha</label>

<input 
type="password"
name="senha"
placeholder="Mínimo de 8 caracteres"
minlength="8"
required>

</div>



<p class="link-secundario">
Toda conta nova é criada com o perfil <strong>Usuário</strong>. Perfis de Técnico e
Administrador são concedidos por um administrador no painel do sistema.
</p>



<button class="botao" type="submit">

Cadastrar

</button>


</form>


<p class="link-secundario">
Já tem conta? <a href="/login">Fazer login</a>
</p>


</div>


</body>

</html>
